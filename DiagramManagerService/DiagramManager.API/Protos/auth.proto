syntax = "proto3";

option csharp_namespace = "DiagramManager.API.GrpcClients";

package auth;

service AuthGrpc {
  rpc ValidateToken (TokenRequest) returns (TokenResponse);
}

message TokenRequest {
  string token = 1;
}

message TokenResponse {
  bool isValid = 1;
  string userId = 2;
  string email = 3;
}
