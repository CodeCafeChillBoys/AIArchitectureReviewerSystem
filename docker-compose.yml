version: '3.8'

services:
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: "UserAuthService_DB,DiagramManagerDb,AIArchitectureReviewerDb"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - app-network

  user-auth-service:
    build:
      context: .
      dockerfile: UserAuthService/Dockerfile
    container_name: user-auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UserAuthService_DB;Username=postgres;Password=postgres
    depends_on:
      - postgres-db
    networks:
      - app-network

  diagram-manager-service:
    build:
      context: .
      dockerfile: DiagramManagerService/Dockerfile
    container_name: diagram-manager-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=DiagramManagerDb;Username=postgres;Password=postgres
      - RabbitMQ__Host=rabbitmq
      - Services__UserAuthUri=http://user-auth-service:8080
    depends_on:
      - postgres-db
      - user-auth-service
      - rabbitmq
    networks:
      - app-network

  ai-reviewer-service:
    build:
      context: .
      dockerfile: AIArchitectureReviewer/Dockerfile
    container_name: ai-reviewer-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=AIArchitectureReviewerDb;Username=postgres;Password=postgres
      - RabbitMQ__Host=rabbitmq
      - Gemini__ApiKeys__0=${GEMINI_API_KEY}
    depends_on:
      - postgres-db
      - rabbitmq
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

  api-gateway:
    build:
      context: .
      dockerfile: APIGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ReverseProxy__Clusters__userAuthCluster__Destinations__destination1__Address=http://user-auth-service:8080
      - ReverseProxy__Clusters__diagramManagerCluster__Destinations__destination1__Address=http://diagram-manager-service:8080
      - ReverseProxy__Clusters__aiReviewerCluster__Destinations__destination1__Address=http://ai-reviewer-service:8080
    depends_on:
      - user-auth-service
      - diagram-manager-service
      - ai-reviewer-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
