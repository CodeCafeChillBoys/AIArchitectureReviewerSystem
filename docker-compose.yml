version: '3.8'

services:
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: "AIArchitectureReviewerDb"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - app-network

  ai-reviewer-service:
    build:
      context: .
      dockerfile: AIArchitectureReviewer/Dockerfile
    container_name: ai-reviewer-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=AIArchitectureReviewerDb;Username=postgres;Password=postgres
      - Gemini__ApiKey=${GEMINI_API_KEY}
    depends_on:
      - postgres-db
    networks:
      - app-network

  api-gateway:
    build:
      context: .
      dockerfile: APIGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ReverseProxy__Clusters__aiReviewerCluster__Destinations__destination1__Address=http://ai-reviewer-service:8080
    depends_on:
      - ai-reviewer-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
